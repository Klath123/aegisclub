name: Enforce dev -> main PRs

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if source branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Error: Only PRs from 'dev' branch are allowed into 'main'."
            exit 1
          fi
